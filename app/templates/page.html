<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title }} | Markdown Converter</title>
  <meta name="description" content="{{ page_description }}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ base_url }}{{ page_url }}">
  {% if ga_id %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ ga_id }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ ga_id }}');
  </script>
  {% endif %}
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/blog.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="logo">Markdown<span>Converter</span></a>
      <nav class="main-nav">
        <a href="/#tool">Ferramenta</a>
        <a href="/#how-it-works">Como funciona</a>
        <a href="/#formats">Formatos</a>
        <a href="/#faq">FAQ</a>
        <a href="/blog">Blog</a>
      </nav>
    </div>
  </header>

  <main>
    <article class="post">
      <div class="container">
        <header class="post-header">
          <h1>{{ page_title }}</h1>
        </header>
        <div class="post-content">
          {{ content | safe }}
        </div>
      </div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Markdown Converter. Todos os direitos reservados.</p>
      <nav>
        <a href="/blog">Blog</a>
        <a href="/privacy">Política de Privacidade</a>
        <a href="/terms">Termos de Uso</a>
        <a href="/contact">Contato</a>
      </nav>
    </div>
  </footer>
</body>
</html>
